[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mrroip"
version = "0.2.0"
description = "Python client for MRRoIP (Model Railroad over IP) endpoints"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
image = ["Pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mrroip = ["py.typed"]

[tool.pyright]
include = ["src", "probe", "tests", "examples"]
exclude = ["**/managed_components", "**/build", "**/__pycache__"]
extraPaths = ["src", "probe"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/mrroip"]
