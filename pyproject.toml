[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mrroip"
version = "0.1.0"
description = "Python client for MRRoIP (Model Railroad over IP) endpoints"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
image = ["Pillow"]

[tool.setuptools.packages.find]
where = ["src"]
